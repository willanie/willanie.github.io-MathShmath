<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> <!-- Link to your single CSS file -->
    <style>
        .custom-btn {
        background-color: #04AA6D; /* Green background */
        border: 3px;
        color: white;
        padding: 0.6vw 1.2vw;
        text-align: center;
        font-size: 2vw;
        cursor: pointer;
        border-radius: 6px; /* Rounded corners */
        }
        .custom-btn.hover { background-color: #015f3d; }

        .custom-btn.active { background-color: #ff0000; }
        .algebracontainer {
            /* background: #f30404; */
            width: 90vw;
            height: 68vh;
            /* max-width: 760px;
            max-height: 500px; */
            text-align: center;
            margin: 0 auto;
            /* height: -webkit-fill-available; */
        }
        canvas {
            background: #1e1e1e;
            border-radius: 4px;
            width: 100%;
            height: auto;
            border: 1px solid #333;
        }
        .controls {
            margin-top: 2px;
            display: grid;
            gap: 4px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #252525;
            padding: 4px;
            border-radius: 8px;
        }
        label { font-size: 0.8rem; font-weight: 600; color: #888; width: 40px; text-align: left; }
        input[type="number"] {
            width: 55px;
            background: #222222;
            border: 1px solid #444;
            color: #00ffcc;
            padding: 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        input[type="range"] { flex-grow: 1; accent-color: #00ffcc; }
    </style>
</head>
<body>
    
    <nav class="navbar">
            <a id="HomeBTN"; href="index.html"><span>&#x1F3E0;<br></span><span>Home</span></a>
            <a id="TrigBTN"; href="trig.html"><span>&#x223F;<br></span><span>Trig</span></a>
            <a id="AlgebraBTN"; href="algebra.html"><span><strong>=</strong><br></span><span>Algebra</span></a>
            <a id="CreditsBTN"; href="credits.html"><span>&#x1F465;</span><span>Credits</span></a>
            <a id="DonutsBTN"; href="donuts.html" class="active"><span>&#x1F369;</span><span>Donuts</span></a>
    </nav>

    <h1 id="algebratitle"; style="color: #ff00ff; text-align: center; font-weight: 900; margin-bottom: 0; font-size: 0.8rem;">Algebra Starter</h1>

<div id="algebracontainer"; class="algebracontainer">
    <button class="custom-btn active"; id="PowButton" onclick="toggleActive(this)">POW</button>
    <button class="custom-btn"; id="CosButton" onclick="toggleActive(this)">COS</button>
    <button class="custom-btn"; id="TanButton" onclick="toggleActive(this)">TAN</button>
    <h2 id="algebraformula"; style="color: #0bd40b; margin-top: 0; margin-bottom: 0;">Pow <i>f</i>(<i>x</i>) =  Value<sup>x</sup> + 1.0</h2>
    <canvas id="graph"></canvas>
    <div id="wavecontrols"; class="controls">
        <div  id="valuecontrol"; class="control-group">
            <label style="color: white;">Value</label>
            <input type="range" id="valueSlider" min="0.1" max="3" step="0.01" value="2.0">
            <input type="number" id="valueInput" value="2.0">
        </div>
        <div id="rangecontrol"; class="control-group">
            <label style="color: white;">Range</label>
            <input type="range" id="rangeSlider" min="0.2" max="60" step="0.01" value="14">
            <input type="number" id="rangeInput" value="14">
        </div>
        <!--
        <div  id="phasecontrol"; class="control-group">
            <label style="color: white;">Phase</label>
            <input type="range" id="phaseSlider" min="0" max="20" step="0.1" value="0">
            <input type="number" id="phaseInput" value="0">
        </div>
        -->
    </div>
</div>

<script>

        document.querySelector(".active")?.classList.remove("active");
        document.querySelector("a#AlgebraBTN").classList.add("active");

    function getDeviceType() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const isTouch = navigator.maxTouchPoints > 0;
        const isCoarse = window.matchMedia("(pointer: coarse)").matches;

        if (isTouch && isCoarse) {
            if (width < 768){
                return 'mobile';
            } else {
                return 'tablet';
            }
        }
        return 'desktop/laptop';
    }
    function getDeviceOrientation() {
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;  
        return isPortrait ? "Portrait" : "Landscape";  
    }


    var activebutton = "POW";
    function toggleActive(button) {
        const buttonIds = ["PowButton", "CosButton", "TanButton"];
        buttonIds.forEach(id => {
            document.getElementById(id).style.backgroundColor = "#04AA6D";
        });
        button.classList.toggle('active');
        button.style.backgroundColor = "#ff0000";
        if (button.id == "PowButton") {
            //console.log("POW button clicked");
            activebutton = "POW";
            document.getElementById("algebraformula").innerHTML = "Sin <i>f</i>(&theta;) =  A&sdot;sin(F&sdot;&theta; + P)";
            resize();
        } else if (button.id == "CosButton") {
            //console.log("COS button button clicked");
            activebutton = "COS";
            document.getElementById("algebraformula").innerHTML = "Cos <i>f</i>(&theta;) =  A&sdot;cos(F&sdot;&theta; + P)";
            resize();
        } else if (button.id == "TanButton") {
            //console.log("COS button button clicked");
            activebutton = "TAN";
            document.getElementById("algebraformula").innerHTML = "Tan <i>f</i>(&theta;) =  A&sdot;tan(F&sdot;&theta; + P)";
            resize();
        }
    }

    const canvas = document.getElementById('graph');
    const ctx = canvas.getContext('2d');
    //console.log("early on ctxcanvaswidth=%d ctxcanvasheight=%d", ctx.canvas.width, ctx.canvas.height);
    const controls = {
        amp: { s: document.getElementById('valueSlider'), n: document.getElementById('valueInput') },
        freq: { s: document.getElementById('rangeSlider'), n: document.getElementById('rangeInput') },
        //phase: { s: document.getElementById('phaseSlider'), n: document.getElementById('phaseInput') }
    };
    const devicetype = getDeviceType();
    const orientation = getDeviceOrientation();
    const algebratitleheight = document.getElementById('algebratitle').offsetHeight;
    const algebraformulaheight = document.getElementById('algebraformula').offsetHeight;
    const PowButtonheight = document.getElementById('PowButton').offsetHeight;
    const algebracontainerheight = document.getElementById('algebracontainer').offsetHeight;
    const wavecontrolsheight = document.getElementById('wavecontrols').offsetHeight;
    const valueInputheight = document.getElementById('valuecontrol').offsetHeight;
    const rangeInputheight = document.getElementById('rangecontrol').offsetHeight;
    //const phaseInputheight = document.getElementById('phaseInput').offsetHeight;
    //const navbarheight = document.getElementById('phaseInput').offsetHeight;
    //console.log("device=%s orientation=%s algebracontainerH=%d titleH=%d formulaH=%d PowButtonH=%d", devicetype, orientation, algebracontainerheight, algebratitleheight, algebraformulaheight, PowButtonheight);
    //console.log("wavecontrolsheight=%d valueInputheight=%d rangeInputheight=%d phaseInputheight=%d navbarheight=%d", wavecontrolsheight, valueInputheight, rangeInputheight, phaseInputheight, navbarheight);


    const valueSlider = document.getElementById('valueSlider');
    const valuemax = valueSlider.max;
    const rangeSlider = document.getElementById('rangeSlider');
    const rangemax = rangeSlider.max;
    const valueValueLabel = document.getElementById('valueValue');
    const rangeValueLabel = document.getElementById('rangeValue');

    //console.log("amp max=%d", valuemax);
    let originalwidth = document.documentElement.clientWidth;
    let originalheight = document.documentElement.clientHeight;
    let w, h;
    let mobilelandscapeH = 50;
    let mobileH = 360;
    let largerH = 700;
    let extralargeH = 640;
    let tabletlandscapeH = 700;
    let tabletportraitH = 1100;
    let laptoplandscapeH = 640;
    let desktoplandscapeH = 940;
    let fixamp = 1.0;
    const mobileOrientationHeights = [700, 360];
    function resize() {
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        //console.log(isPortrait);
        //console.log(isPortrait ? "Portrait" : "Landscape");
        if (isPortrait) {
            //console.log("isPortrait=%s height chosen=%d", isPortrait, mobileOrientationHeights[1]);
        }
        else {
            //console.log("isPortrait=%s height chosen=%d", isPortrait, mobileOrientationHeights[0]);
        }
        //console.log("in resize before assignment canvaswidth=%d canvasheight=%d canvasoffsetWidth=%d", canvas.width, canvas.height, canvas.offsetWidth);
        w = canvas.width = canvas.offsetWidth * 2;
        h = canvas.height = largerH;
        //console.log("originalwidth=%d originalheight=%d w=%d h=%d", originalwidth, originalheight, w, h);
        if (devicetype == 'mobile'){
            if (orientation == 'Portrait'){
                h = canvas.height = mobileH;
                fixamp = ( mobileH / mobileH );
            } else {
                h = canvas.height = mobilelandscapeH;
                fixamp = ( mobilelandscapeH / mobileH);
            }
        }
        if (devicetype == 'tablet') {
            if (orientation == 'Portrait') {
                h = canvas.height = tabletportraitH;
                fixamp = ( tabletportraitH / mobileH);
            } else {
                h = canvas.height = tabletlandscapeH;
                fixamp = ( tabletlandscapeH / mobileH);
            }
        }

        if (devicetype == 'desktop/laptop') {
            if (originalheight < 700){
                h = canvas.height = laptoplandscapeH;
                fixamp = ( laptoplandscapeH / mobileH);
            } else {
                h = canvas.height = desktoplandscapeH;
                fixamp = ( desktoplandscapeH / mobileH);
            }
        }

        draw();
    }

    function update(key, val) {
        controls[key].s.value = val;
        controls[key].n.value = val;
        draw();
    }

    Object.keys(controls).forEach(key => {
        controls[key].s.oninput = (e) => update(key, e.target.value);
        controls[key].n.oninput = (e) => update(key, e.target.value);
        //console.log(key);
    });

    //console.log(Object.keys(controls));

    function draw() {
        ctx.clearRect(0, 0, w, h);
        
        // Draw main axes thicker
        ctx.strokeStyle = '#ff0000';
        ctx.beginPath();
        const originhalfX = w / 2.0;
        const originY = h / 2;
        const originX = w / 2;

        // Y Axis
        ctx.moveTo(originhalfX, 0);
        ctx.lineTo(originhalfX, h);
        ctx.stroke();

        // X Axis
        ctx.moveTo(originX, originY);
        ctx.lineTo(w , originY);
        ctx.stroke();

        // Grid & Labels
        ctx.strokeStyle = '#4a4a4a';
        ctx.lineWidth = 5;
        ctx.fillStyle = '#999';
        ctx.font = '24px sans-serif';
        
        // vertical lines
        for(let i = 0; i <= 10; i++) {
            let x = (w/10) * i;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }

        // horizontal lines
        //console.log("rangemax=%f", rangemax);
        const stepynums = h/20;
        let y = h + stepynums;
        for(let i = -10; i <= 10; i++) {
            y = y - stepynums;
            //let num = ((rangemax / 2) * i);
            let num = i;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            //ctx.fillText(Math.round(h/2 - y), 10, y - 10);
            ctx.fillText(Math.round(num), 30, y - 10);
            //console.log("roundnum=%d y=%d", Math.round(num), (y - 10));
        }


            
        const isPortrait = window.matchMedia("(orientation: portrait)").matches;
        // Sine Wave
        let ampscale = 0.5;
        //console.log("in draw isPortrait=%s canvaswidth=%d w=%d h=%d", isPortrait, canvas.width, w, h);
        if (canvas.width > 600) {
            //console.log("in ampscale fix isPortrait=%s width=%d", isPortrait, w);

            ampscale = ampscale * fixamp;
        }
        const a = parseFloat(controls.amp.n.value) * ampscale;
        const f = parseFloat(controls.freq.n.value) * 1.0;
        let p = 0;
        //console.log(activebutton);
        if (activebutton == "POW" || activebutton == "TAN") {
            //console.log("POW button here");
            //p = parseFloat(controls.phase.n.value) * 1.0;    
        } else {
            //console.log("COS button here");
            //p = (parseFloat(controls.phase.n.value) * 1.0) + Math.PI;
        }

        ctx.strokeStyle = '#ffffff';


        // Y Axis
        ctx.beginPath();
        ctx.moveTo(w/2, 0);
        ctx.lineTo(w/2, h);
        ctx.stroke();
        // X Axis
        ctx.moveTo(0, h/2);
        ctx.lineTo(w , h/2);
        ctx.stroke();

        const halfw = w / 2;
        const step = f / w;
        const scaleY = h / 120; // 5 units up, 5 units down
        const stepy = h / 20;
        //console.log("w=%f value=%f range=%f step=%f", w,a,f,step);

        ctx.beginPath();
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 8;
        for (let x = 0; x < w; x += 8) {
            //const xUnit = -halfw + (x * step);
            const xUnit = ((x - halfw) * step);
            let y = 0;
            //console.log("inside %s", activebutton);
            if (activebutton == "POW") {
                //console.log("inside sin side of if %s p=%f", activebutton, p);
                //y = h/2 + Math.sin((xUnit) + p) * a;
                y = (h/2 + (scaleY * Math.pow(a,xUnit) + stepy) * -1.0) ;
                //console.log("halfw=%f step=%f h=%d a=%f xUnit=%f y=%f",halfw, step, h, a, xUnit, y);
            }
            if (activebutton == "COS") {
                //console.log("inside sin side of if %s p=%f", activebutton, p);
                y = h/2 + Math.cos((xUnit) + p) * a;
                //console.log("inside COS side xunit=%f y=%f", xUnit, y);
            }
            if (activebutton == "TAN") {
                //console.log("inside sin side of if %s p=%f", activebutton, p);
                y = h/2 + Math.tan((xUnit) + p) * (a/10.0);
                //console.log("inside TAN side xunit=%f y=%f", xUnit, y);
            }
            if (x === 0) {
                ctx.moveTo(x, y);
            } else if (x > 0) {
                ctx.lineTo(x, y);
            }
            //x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    window.onresize = resize;
    resize();
    window.addEventListener('load', () => {
        // Get the updated viewport dimensions
        originalwidth = window.innerWidth;
        originalheight = window.innerHeight;
        //window.scrollTo(0, 0);
        //console.log(`Document loaded: ${originalwidth}x${originalheight}`);
    });

    window.addEventListener('orientationchange', () => {
    // Get the updated viewport dimensions
    location.reload();
    originalwidth = window.innerWidth;
    originalheight = window.innerHeight;

    });
    
    //console.log(`orientationchange called: ${originalwidth}x${originalheight}`);
</script>
</body>
</html>
